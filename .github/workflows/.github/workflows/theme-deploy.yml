name: Push Theme to Staging

on:
  push:
    branches:
      - main

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    env:
      SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
      SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_FLAG_STORE }}
      SHOPIFY_FLAG_NO_INPUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: Shopify/cli-action@v1
      - name: Push theme to staging theme ID
        run: shopify theme push --theme "${{ secrets.SHOPIFY_STAGING_THEME_ID }}" --path "."
